# Nginx site for Uptrix. Copy to /etc/nginx/sites-available/uptrix,
# replace uptrixglobal.com with your production domain, then enable it.
# Certbot adds the HTTPS part automatically.

# Redirect legacy admin subdomain to proud subdomain
server {
    listen 80;
    listen [::]:80;
    server_name admin.uptrixglobal.com;
    return 301 https://proud.uptrixglobal.com$request_uri;
}

# Main site & proud admin subdomain
server {
    listen 80;
    listen [::]:80;
    server_name uptrixglobal.com www.uptrixglobal.com proud.uptrixglobal.com;

    # Large enough for admin saves and blog image uploads (8 MB limit)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Built files never change, so browsers can keep them for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
